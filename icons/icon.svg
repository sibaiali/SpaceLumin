<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#010a13"/>
    </radialGradient>
    <linearGradient id="ship" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ac8b9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ac8b9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="80" cy="100" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="420" cy="80" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="150" cy="400" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="380" cy="350" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="200" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="60" cy="280" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="450" r="1" fill="#fff" opacity="0.4"/>
  <!-- Engine glow trail -->
  <ellipse cx="256" cy="340" rx="30" ry="80" fill="url(#glow)"/>
  <!-- Ship body -->
  <polygon points="256,120 200,320 256,280 312,320" fill="url(#ship)"/>
  <!-- Wings -->
  <polygon points="200,280 160,320 200,300" fill="#38bdf8"/>
  <polygon points="312,280 352,320 312,300" fill="#38bdf8"/>
  <!-- Engine core -->
  <ellipse cx="256" cy="290" rx="15" ry="8" fill="#fff" opacity="0.9"/>
</svg>
